<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run Explorer</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><span class="mark">✳</span><div><strong>RUN EXPLORER</strong><small>SHIP / FIX WORKFLOW</small></div></div><div id="connection" class="connection">Connecting…</div><button id="theme" aria-label="Change theme">◐</button></header>
<main><aside class="sidebar"><div class="section-title">RUNS <span id="count" class="count">0</span></div><input id="search" placeholder="Search runs…" aria-label="Search runs"><select id="filter" aria-label="Filter workflow"><option value="">All workflows</option><option>ship</option><option>fix</option></select><select id="status-filter" aria-label="Filter status"><option value="">All states</option></select><div id="runs" class="runs"></div></aside>
<section class="workspace"><div id="empty" class="empty"><h2>Select a run</h2><p>Choose a run to inspect its status and activity.</p></div><div id="content" hidden><div class="hero"><div><div class="eyebrow" id="run-type"></div><h1 id="title"></h1><p id="subtitle"></p></div><div id="overall" class="badge"></div></div><div id="warnings" class="warnings"></div><nav class="tabs" aria-label="Run views"><button data-tab="overview" class="active">Overview</button><button data-tab="activity">Activity</button><button data-tab="artifacts">Artifacts</button></nav><div id="overview"></div><div id="activity" hidden><div class="toolbar"><select id="repo-filter" aria-label="Filter repository"><option value="">All repositories</option></select><select id="phase-filter" aria-label="Filter phase status"><option value="">All results</option><option value="open">Open</option><option value="passed">Passed</option><option value="failed">Failed</option><option value="blocked">Blocked</option><option value="interrupted">Interrupted</option></select><select id="sort" aria-label="Sort phases"><option value="time">Latest first</option><option value="duration">Longest first</option></select></div><div id="phase-list"></div></div><div id="artifacts" hidden><input id="artifact-search" placeholder="Search artifacts…" aria-label="Search artifacts"><div id="artifact-list"></div></div></div></section></main><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="Close">✕</button></div><div id="dialog-body"></div></dialog>
<script src="/app.js"></script></body></html>
